<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Driver Trips — Glass Chips Mock</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  :root {
    --glass-bg: rgba(255, 255, 255, 0.62);
    --glass-border: rgba(255, 255, 255, 0.5);
    --glass-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
    --text: #0f172a;
    --muted: #475569;
    --brand: #1f6ab5;
    --accent: #33a15e;
    --card-bg: rgba(255,255,255,0.55);
    --card-border: rgba(255,255,255,0.45);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --glass-bg: rgba(20, 28, 40, 0.55);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --card-bg: rgba(255,255,255,0.05);
      --card-border: rgba(255,255,255,0.08);
    }
  }
  html[data-theme="light"] {
    --glass-bg: rgba(255, 255, 255, 0.62);
    --glass-border: rgba(255, 255, 255, 0.5);
    --glass-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
    --text: #0f172a; --muted: #475569;
    --card-bg: rgba(255,255,255,0.55);
    --card-border: rgba(255,255,255,0.45);
  }
  html[data-theme="dark"] {
    --glass-bg: rgba(20, 28, 40, 0.55);
    --glass-border: rgba(255, 255, 255, 0.12);
    --glass-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    --text: #f1f5f9; --muted: #94a3b8;
    --card-bg: rgba(255,255,255,0.05);
    --card-border: rgba(255,255,255,0.08);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif; color: var(--text); }
  #phone {
    position: relative;
    width: 100%; max-width: 420px;
    height: 100dvh;
    margin: 0 auto;
    overflow: hidden;
    background: #000;
  }
  #map { position: absolute; inset: 0; }

  .glass {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    box-shadow: var(--glass-shadow);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border-radius: 16px;
  }

  /* header bar */
  .header {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: 14px; right: 14px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header .title { flex: 1; font-size: 17px; font-weight: 700; }
  .icon-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: grid; place-items: center;
    cursor: pointer;
  }
  .icon-btn svg { width: 18px; height: 18px; }

  /* filter pills below header */
  .filters {
    position: absolute;
    top: calc(max(14px, env(safe-area-inset-top)) + 64px);
    left: 14px; right: 14px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 4px;
  }
  .filters::-webkit-scrollbar { display: none; }
  .pill {
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .pill .count {
    background: rgba(0,0,0,0.08);
    padding: 1px 7px;
    border-radius: 999px;
    font-size: 11px;
  }
  html[data-theme="dark"] .pill .count { background: rgba(255,255,255,0.12); }
  .pill.active {
    background: var(--brand);
    color: #fff;
    border-color: transparent;
  }
  .pill.active .count { background: rgba(255,255,255,0.22); color: #fff; }

  /* recenter FAB */
  .fab {
    position: absolute;
    right: 14px;
    bottom: calc(55dvh + 12px);
    width: 44px; height: 44px;
    border-radius: 50%;
    display: grid; place-items: center;
    cursor: pointer;
  }
  .fab svg { width: 18px; height: 18px; }

  /* bottom sheet — trip list */
  .sheet {
    position: absolute;
    left: 8px; right: 8px;
    bottom: 84px;
    height: 55dvh;
    padding: 10px 0 0;
    border-radius: 22px;
    display: flex;
    flex-direction: column;
  }
  .sheet .grabber {
    width: 40px; height: 4px;
    background: var(--muted);
    opacity: .35;
    border-radius: 999px;
    margin: 0 auto 8px;
  }
  .sheet .list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 12px 14px;
  }
  .sheet .list::-webkit-scrollbar { width: 0; }

  .trip {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: transform 120ms, border-color 120ms;
  }
  .trip.selected {
    border-color: var(--brand);
    box-shadow: 0 0 0 2px rgba(31, 106, 181, 0.18);
  }
  .trip .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .badge {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
  }
  .badge.pending  { background: rgba(250, 204, 21, 0.18); color: #b45309; }
  .badge.active   { background: rgba(34, 197, 94, 0.18); color: #15803d; }
  .badge.done     { background: rgba(148, 163, 184, 0.18); color: var(--muted); }
  html[data-theme="dark"] .badge.pending { color: #fcd34d; }
  html[data-theme="dark"] .badge.active  { color: #86efac; }

  .trip .eta { font-size: 12px; font-weight: 700; color: var(--muted); }
  .trip .row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 13px;
    line-height: 1.3;
  }
  .trip .row + .row { margin-top: 4px; }
  .pin {
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-top: 5px;
    flex-shrink: 0;
  }
  .pin.from { background: #22c55e; }
  .pin.to   { background: #ef4444; }

  .trip .meta {
    margin-top: 10px;
    display: flex;
    gap: 12px;
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
  }
  .trip .actions {
    margin-top: 10px;
    display: none;
    gap: 8px;
  }
  .trip.selected.pending .actions { display: flex; }
  .btn {
    flex: 1;
    height: 36px;
    border-radius: 10px;
    border: none;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--card-border);
  }

  /* bottom nav */
  .nav {
    position: absolute;
    left: 8px; right: 8px;
    bottom: max(8px, env(safe-area-inset-bottom));
    padding: 8px 6px;
    border-radius: 22px;
    display: flex;
    justify-content: space-around;
  }
  .nav .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 0;
    border-radius: 14px;
    cursor: pointer;
  }
  .nav .tab .ico { width: 22px; height: 22px; color: var(--muted); }
  .nav .tab .ico svg { width: 100%; height: 100%; display: block; }
  .nav .tab .lbl { font-size: 10px; font-weight: 600; color: var(--muted); }
  .nav .tab.active .ico { color: var(--brand); }
  .nav .tab.active .lbl { color: var(--brand); }
  .nav .tab.active { background: rgba(31, 106, 181, 0.10); }
</style>
</head>
<body>
<div id="phone">
  <div id="map"></div>

  <!-- header -->
  <div class="header glass">
    <div class="title">Trips</div>
    <div class="icon-btn" id="themeBtn" title="Theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    </div>
    <div class="icon-btn" title="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </div>
  </div>

  <!-- filter pills -->
  <div class="filters">
    <div class="pill glass active" data-f="pending">Pending <span class="count">3</span></div>
    <div class="pill glass" data-f="active">Active <span class="count">1</span></div>
    <div class="pill glass" data-f="done">Completed <span class="count">128</span></div>
  </div>

  <!-- recenter -->
  <div class="fab glass" id="recenter" title="Recenter">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </div>

  <!-- bottom sheet — trip list -->
  <div class="sheet glass">
    <div class="grabber"></div>
    <div class="list" id="list"></div>
  </div>

  <!-- bottom nav -->
  <div class="nav glass">
    <div class="tab" data-tab="home">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg></div>
      <div class="lbl">Home</div>
    </div>
    <div class="tab active" data-tab="trips">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2"/><circle cx="18" cy="12" r="2"/><path d="M12 4v6"/><path d="M12 14v6"/><path d="M12 10c1.5 0 4-1.5 4-4"/><path d="M12 14c-1.5 0-4 1.5-4 4"/></svg></div>
      <div class="lbl">Trips</div>
    </div>
    <div class="tab" data-tab="history">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
      <div class="lbl">History</div>
    </div>
    <div class="tab" data-tab="settings">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06A2 2 0 1 1 4.27 16.96l.06-.06A1.65 1.65 0 0 0 4.66 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6 1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9c.13.31.2.65.2 1s-.07.69-.2 1Z"/></svg></div>
      <div class="lbl">Settings</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
  // ---- sample trips ----
  const TRIPS = [
    { id: "T-1042", status: "pending", from: { name: "Plainview, NY", lng: -73.4673, lat: 40.7787 }, to:   { name: "Washington, DC", lng: -77.0369, lat: 38.9072 }, miles: 245, weight: "32,400 lbs", offered: "3 min ago" },
    { id: "T-1043", status: "pending", from: { name: "Brooklyn, NY",  lng: -73.9442, lat: 40.6782 }, to:   { name: "Boston, MA",     lng: -71.0589, lat: 42.3601 }, miles: 215, weight: "18,200 lbs", offered: "12 min ago" },
    { id: "T-1044", status: "pending", from: { name: "Queens, NY",    lng: -73.7949, lat: 40.7282 }, to:   { name: "Philadelphia, PA",lng: -75.1652, lat: 39.9526 }, miles: 95,  weight: "24,000 lbs", offered: "1 hour ago" },
    { id: "T-1041", status: "active",  from: { name: "Manhattan, NY", lng: -73.9712, lat: 40.7831 }, to:   { name: "Baltimore, MD",  lng: -76.6122, lat: 39.2904 }, miles: 188, weight: "29,800 lbs", offered: "Accepted 2h ago" },
    { id: "T-1040", status: "done",    from: { name: "Newark, NJ",    lng: -74.1745, lat: 40.7357 }, to:   { name: "Albany, NY",     lng: -73.7562, lat: 42.6526 }, miles: 152, weight: "12,500 lbs", offered: "Delivered yesterday" },
    { id: "T-1039", status: "done",    from: { name: "Jersey City",   lng: -74.0431, lat: 40.7178 }, to:   { name: "Hartford, CT",   lng: -72.6851, lat: 41.7637 }, miles: 130, weight: "9,800 lbs",  offered: "Delivered 2d ago" },
  ];

  let filter = "pending";
  let selectedId = TRIPS.find(t => t.status === filter)?.id ?? null;

  function statusLabel(s) {
    return s === "pending" ? "Pending" : s === "active" ? "In Progress" : "Completed";
  }
  function etaShort(s, miles) {
    if (s === "done") return "—";
    const h = Math.round(miles / 55);
    return s === "active" ? `${h}h ETA` : `~${h}h drive`;
  }

  function render() {
    const list = document.getElementById("list");
    const filtered = TRIPS.filter(t => t.status === filter);
    list.innerHTML = filtered.map(t => `
      <div class="trip ${t.status} ${t.id === selectedId ? "selected" : ""}" data-id="${t.id}">
        <div class="top">
          <div class="badge ${t.status}">${statusLabel(t.status)}</div>
          <div class="eta">${etaShort(t.status, t.miles)}</div>
        </div>
        <div class="row"><div class="pin from"></div><div><b>Pickup</b> · ${t.from.name}</div></div>
        <div class="row"><div class="pin to"></div><div><b>Drop</b> · ${t.to.name}</div></div>
        <div class="meta">
          <span>${t.miles} mi</span>
          <span>${t.weight}</span>
          <span>${t.offered}</span>
        </div>
        <div class="actions">
          <button class="btn ghost" data-act="reject" data-id="${t.id}">Decline</button>
          <button class="btn primary" data-act="accept" data-id="${t.id}">Accept</button>
        </div>
      </div>
    `).join("");

    list.querySelectorAll(".trip").forEach(el => {
      el.addEventListener("click", () => {
        selectedId = el.dataset.id;
        render();
        focusTrip(selectedId);
      });
    });
    list.querySelectorAll(".btn").forEach(b => {
      b.addEventListener("click", (e) => { e.stopPropagation(); /* mock */ });
    });
  }

  function setFilter(f) {
    filter = f;
    document.querySelectorAll(".pill").forEach(p => p.classList.toggle("active", p.dataset.f === f));
    const first = TRIPS.find(t => t.status === f);
    selectedId = first?.id ?? null;
    render();
    if (selectedId) focusTrip(selectedId);
  }
  document.querySelectorAll(".pill").forEach(p => p.addEventListener("click", () => setFilter(p.dataset.f)));

  // ---- map ----
  const darkMql = window.matchMedia("(prefers-color-scheme: dark)");
  const lightStyle = "https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json";
  const darkStyle  = "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json";

  const map = new maplibregl.Map({
    container: "map",
    style: darkMql.matches ? darkStyle : lightStyle,
    center: [-74.5, 40.5],
    zoom: 6.5,
    pitch: 0,
    attributionControl: false,
  });

  const markers = [];
  function clearMarkers() { markers.forEach(m => m.remove()); markers.length = 0; }
  function addPin(lng, lat, color) {
    const el = document.createElement("div");
    el.style.cssText = `width:14px;height:14px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.25);`;
    const m = new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(map);
    markers.push(m);
  }
  function drawRoute(coords) {
    if (map.getLayer("route")) map.removeLayer("route");
    if (map.getSource("route")) map.removeSource("route");
    map.addSource("route", {
      type: "geojson",
      data: { type: "Feature", geometry: { type: "LineString", coordinates: coords } },
    });
    map.addLayer({
      id: "route", type: "line", source: "route",
      paint: { "line-color": "#1f6ab5", "line-width": 5, "line-opacity": 0.9 },
      layout: { "line-cap": "round", "line-join": "round" },
    });
  }
  function focusTrip(id) {
    const t = TRIPS.find(x => x.id === id);
    if (!t) return;
    clearMarkers();
    addPin(t.from.lng, t.from.lat, "#22c55e");
    addPin(t.to.lng,   t.to.lat,   "#ef4444");
    drawRoute([[t.from.lng, t.from.lat], [t.to.lng, t.to.lat]]);
    const bounds = new maplibregl.LngLatBounds([t.from.lng, t.from.lat], [t.to.lng, t.to.lat]);
    map.fitBounds(bounds, { padding: { top: 140, bottom: window.innerHeight * 0.6, left: 40, right: 40 }, duration: 700 });
  }

  map.on("style.load", () => { if (selectedId) focusTrip(selectedId); });
  document.getElementById("recenter").addEventListener("click", () => { if (selectedId) focusTrip(selectedId); });

  // theme toggle
  const THEMES = ["auto", "light", "dark"];
  let themeIdx = 0;
  function isDarkActive() {
    const t = THEMES[themeIdx];
    if (t === "dark") return true;
    if (t === "light") return false;
    return darkMql.matches;
  }
  document.getElementById("themeBtn").addEventListener("click", () => {
    themeIdx = (themeIdx + 1) % THEMES.length;
    const t = THEMES[themeIdx];
    if (t === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", t);
    map.setStyle(isDarkActive() ? darkStyle : lightStyle);
  });
  darkMql.addEventListener("change", () => {
    if (THEMES[themeIdx] === "auto") map.setStyle(isDarkActive() ? darkStyle : lightStyle);
  });

  // nav tabs — navigate between mock pages
  const NAV_HREF = {
    home: "driver-home-v2.html",
    trips: "driver-trips-v2.html",
    history: "driver-trips-v2.html",
    settings: "driver-trips-v2.html",
  };
  document.querySelectorAll(".nav .tab").forEach((t) => {
    t.addEventListener("click", () => {
      const dest = NAV_HREF[t.dataset.tab];
      if (dest) window.location.href = dest;
    });
  });

  render();
</script>
</body>
</html>
