<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Trip Analytics — Glass Mock</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  :root {
    --glass-bg: rgba(255, 255, 255, 0.72);
    --glass-border: rgba(255, 255, 255, 0.5);
    --text: #0f172a;
    --muted: #475569;
    --brand: #1f6ab5;
    --green: #16a34a;
    --red: #ef4444;
    --amber: #f59e0b;
    --card-bg: rgba(255,255,255,0.55);
    --card-border: rgba(255,255,255,0.45);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --glass-bg: rgba(20, 28, 40, 0.62);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text: #f1f5f9; --muted: #94a3b8;
      --card-bg: rgba(255,255,255,0.05); --card-border: rgba(255,255,255,0.08);
    }
  }
  html[data-theme="light"] { --glass-bg: rgba(255,255,255,0.72); --text:#0f172a; --muted:#475569; --card-bg:rgba(255,255,255,0.55); --card-border:rgba(255,255,255,0.45); }
  html[data-theme="dark"]  { --glass-bg: rgba(20,28,40,0.62); --text:#f1f5f9; --muted:#94a3b8; --card-bg:rgba(255,255,255,0.05); --card-border:rgba(255,255,255,0.08); }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif; color: var(--text); }
  #phone {
    position: relative;
    width: 100%; max-width: 420px;
    height: 100dvh;
    margin: 0 auto;
    overflow: hidden;
    background: #000;
  }
  #map { position: absolute; inset: 0; height: 38%; }
  /* gradient fade from map into the body */
  .map-fade {
    position: absolute;
    inset: 0;
    height: 42%;
    pointer-events: none;
    background: linear-gradient(to bottom, transparent 60%, var(--glass-bg) 100%);
  }

  .glass {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-radius: 18px;
  }

  /* header */
  .header {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: 14px; right: 14px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 5;
  }
  .icon-btn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; }
  .icon-btn svg { width: 18px; height: 18px; }
  .header .title { flex: 1; font-size: 16px; font-weight: 700; }
  .header .sub { font-size: 11px; color: var(--muted); letter-spacing: 0.6px; text-transform: uppercase; font-weight: 700; }

  /* scroll body */
  .scroll {
    position: absolute;
    left: 0; right: 0;
    top: 36%;
    bottom: 0;
    overflow-y: auto;
    padding: 8px 12px max(20px, env(safe-area-inset-bottom));
  }
  .scroll::-webkit-scrollbar { width: 0; }

  /* KPI top row */
  .kpis {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .kpi {
    padding: 12px 14px;
    border-radius: 16px;
  }
  .kpi .l { font-size: 10px; color: var(--muted); letter-spacing: 0.7px; text-transform: uppercase; font-weight: 700; }
  .kpi .v { font-size: 22px; font-weight: 800; margin-top: 4px; letter-spacing: -0.4px; }
  .kpi .d {
    font-size: 11px;
    font-weight: 600;
    margin-top: 4px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .kpi .d.up   { color: var(--green); }
  .kpi .d.down { color: var(--red); }
  .kpi .d svg { width: 11px; height: 11px; }
  .kpi.pay .v { color: var(--green); }

  /* generic card */
  .card { padding: 14px; border-radius: 16px; margin-bottom: 10px; }
  .card .title { font-size: 13px; font-weight: 700; }
  .card .sub-r { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .card .sub-r .meta { font-size: 11px; color: var(--muted); font-weight: 600; }

  /* speed chart */
  .speed-wrap {
    position: relative;
    height: 110px;
    margin-top: 6px;
  }
  .speed-wrap svg { width: 100%; height: 100%; display: block; }
  .speed-wrap .legend {
    position: absolute; left: 0; top: 0;
    font-size: 10px;
    color: var(--muted);
    font-weight: 600;
  }
  .legend-row {
    display: flex; gap: 12px;
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
  }
  .legend-row .swatch { width: 10px; height: 3px; border-radius: 2px; display: inline-block; margin-right: 4px; vertical-align: middle; }

  /* time breakdown bar */
  .bar {
    margin-top: 8px;
    display: flex;
    height: 14px;
    border-radius: 999px;
    overflow: hidden;
    background: var(--card-border);
  }
  .bar > div { height: 100%; }
  .seg.drive { background: var(--brand); }
  .seg.idle  { background: var(--amber); }
  .seg.stop  { background: var(--muted); }

  .bar-legend {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 10px;
  }
  .bar-legend .item { font-size: 11px; }
  .bar-legend .item .v { font-weight: 800; font-size: 14px; }
  .bar-legend .item .l { color: var(--muted); font-size: 10px; letter-spacing: 0.5px; text-transform: uppercase; font-weight: 700; margin-top: 1px; }
  .bar-legend .item .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }

  /* events list */
  .events { display: flex; flex-direction: column; gap: 8px; }
  .event {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
  }
  .event .icon {
    width: 30px; height: 30px;
    border-radius: 10px;
    display: grid; place-items: center;
    color: #fff;
    flex-shrink: 0;
  }
  .event .icon svg { width: 16px; height: 16px; }
  .event.warn  .icon { background: var(--amber); }
  .event.bad   .icon { background: var(--red); }
  .event.good  .icon { background: var(--green); }
  .event .meta { flex: 1; }
  .event .meta .h { font-size: 13px; font-weight: 700; }
  .event .meta .s { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .event .time { font-size: 11px; color: var(--muted); font-weight: 700; }

  /* score */
  .score-row { display: flex; align-items: center; gap: 14px; }
  .ring {
    width: 76px; height: 76px;
    flex-shrink: 0;
  }
  .ring-text {
    font-size: 24px;
    font-weight: 800;
  }
  .score-meta { flex: 1; }
  .score-meta .h { font-size: 14px; font-weight: 800; }
  .score-meta .s { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.3; }
</style>
</head>
<body>
<div id="phone">
  <div id="map"></div>
  <div class="map-fade"></div>

  <div class="header glass">
    <div class="icon-btn" id="backBtn" title="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div style="flex:1;line-height:1.1;">
      <div class="sub">Trip T-1041 · Analytics</div>
      <div class="title">Manhattan → Washington</div>
    </div>
    <div class="icon-btn" title="Share">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg>
    </div>
  </div>

  <div class="scroll">
    <!-- KPIs -->
    <div class="kpis">
      <div class="kpi glass">
        <div class="l">Distance</div>
        <div class="v">188 <span style="font-size:13px;color:var(--muted);font-weight:700;">mi</span></div>
      </div>
      <div class="kpi glass">
        <div class="l">Drive Time</div>
        <div class="v">3h 44m</div>
      </div>
      <div class="kpi glass pay">
        <div class="l">Pay</div>
        <div class="v">$1,420</div>
      </div>
      <div class="kpi glass">
        <div class="l">$ / mile</div>
        <div class="v">$7.55</div>
      </div>
    </div>

    <!-- pickup / delivery -->
    <div class="card glass">
      <div class="title" style="margin-bottom:10px;">Stops</div>
      <div class="events">
        <div class="event good">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
          <div class="meta"><div class="h">Picked up</div><div class="s">450 W 33rd St, Manhattan</div></div>
          <div class="time">7:54 AM</div>
        </div>
        <div class="event good">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
          <div class="meta"><div class="h">Delivered</div><div class="s">2200 Pennsylvania Ave NW, Washington, DC</div></div>
          <div class="time">11:38 AM</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
  const darkMql = window.matchMedia("(prefers-color-scheme: dark)");
  const lightStyle = "https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json";
  const darkStyle  = "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json";

  const from = [-73.9971, 40.7544];
  const to   = [-77.0369, 38.9072];
  const coords = [from, [-74.17, 40.73], [-75.165, 39.95], [-76.61, 39.29], to];

  const map = new maplibregl.Map({
    container: "map",
    style: darkMql.matches ? darkStyle : lightStyle,
    center: [-75.6, 40.0],
    zoom: 5.6,
    pitch: 0,
    attributionControl: false,
    interactive: false,
  });

  function addPin(lng, lat, color) {
    const el = document.createElement("div");
    el.style.cssText = `width:12px;height:12px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.3);`;
    new maplibregl.Marker({ element: el }).setLngLat([lng, lat]).addTo(map);
  }
  function drawRoute() {
    if (map.getLayer("route")) map.removeLayer("route");
    if (map.getSource("route")) map.removeSource("route");
    map.addSource("route", { type: "geojson", data: { type: "Feature", geometry: { type: "LineString", coordinates: coords } } });
    map.addLayer({
      id: "route", type: "line", source: "route",
      paint: { "line-color": "#1f6ab5", "line-width": 4, "line-opacity": 0.9 },
      layout: { "line-cap": "round", "line-join": "round" },
    });
    const b = new maplibregl.LngLatBounds(from, to);
    map.fitBounds(b, { padding: { top: 60, bottom: 30, left: 30, right: 30 }, duration: 0 });
  }
  addPin(from[0], from[1], "#22c55e");
  addPin(to[0],   to[1],   "#16a34a");
  map.on("style.load", drawRoute);

  // back
  document.getElementById("backBtn").addEventListener("click", () => {
    window.location.href = "driver-delivered-v2.html";
  });
</script>
</body>
</html>
