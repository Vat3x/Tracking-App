<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoadMind Tracker — Invite</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f5f7fa; color: #333; padding: 20px; }
    .card { background: #fff; border-radius: 16px; padding: 40px 32px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h1 { font-size: 22px; color: #1F6AB5; margin-bottom: 16px; }
    .step { font-size: 16px; color: #333; line-height: 1.6; margin-bottom: 6px; font-weight: 500; }
    .step span { color: #1a73e8; font-weight: 700; }
    .spacer { height: 18px; }
    .btn { display: inline-block; background: #1a73e8; color: #fff; padding: 14px 32px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 16px; }
    .btn:hover { background: #1557b0; }
    .btn-secondary { display: inline-block; background: transparent; color: #1a73e8; border: 1.5px solid #1a73e8; padding: 12px 28px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 14px; margin-top: 12px; }
    .small { font-size: 13px; color: #999; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>LoadMind Tracker</h1>
    <p class="step"><span>1.</span> Download the app</p>
    <p class="step"><span>2.</span> Tap this link again to register and connect</p>
    <div class="spacer"></div>
    <div id="store-btns">
      <!-- populated by JS below -->
      <a class="btn" href="https://play.google.com/store/apps/details?id=com.nexus.tracking.driver">Get the App</a>
    </div>
  </div>
  <script>
    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/.test(ua);
    var isAndroid = /Android/.test(ua);
    var path = window.location.pathname;
    var inviteId = path.split('/invite/')[1] || '';

    var appStore = 'https://apps.apple.com/us/app/loadmind-tracker/id6760754995';
    var playStore = 'https://play.google.com/store/apps/details?id=com.nexus.tracking.driver';

    var container = document.getElementById('store-btns');

    if (isIOS) {
      container.innerHTML =
        '<a class="btn" href="' + appStore + '">Get the App</a>';
    } else if (isAndroid) {
      var intentUrl = 'intent://invite/' + inviteId +
        '#Intent;scheme=nexustracking;package=com.nexus.tracking.driver;' +
        'S.browser_fallback_url=' + encodeURIComponent(playStore) + ';end';
      container.innerHTML =
        '<a class="btn" href="' + intentUrl + '">Open App</a>' +
        '<br><a class="btn-secondary" href="' + playStore + '">Get the App</a>';
    } else {
      container.innerHTML =
        '<a class="btn" href="' + appStore + '">Get on App Store</a>' +
        '<br><a class="btn-secondary" href="' + playStore + '">Get on Google Play</a>';
    }
  </script>
</body>
</html>
