<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoadMind Tracker — Invite</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f5f7fa; color: #333; padding: 20px; }
    .card { background: #fff; border-radius: 16px; padding: 32px 24px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h1 { font-size: 20px; color: #1F6AB5; margin-bottom: 28px; }

    .btn-main { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 18px 20px; border-radius: 14px; text-decoration: none; font-size: 18px; font-weight: 700; background: #16a34a; color: #fff; }
    .btn-main:active { background: #15803d; }
    .btn-icon { font-size: 32px; line-height: 1; }

    .secondary { margin-top: 24px; }
    .secondary-label { font-size: 14px; color: #9ca3af; margin-bottom: 6px; }
    .secondary-link { font-size: 15px; color: #1a73e8; font-weight: 600; text-decoration: none; }
    .secondary-link:active { color: #1557b0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>LoadMind Tracker</h1>
    <div id="content"></div>
  </div>
  <script>
    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/.test(ua);
    var path = window.location.pathname;
    var inviteId = path.split('/invite/')[1] || '';

    var appStore = 'https://apps.apple.com/us/app/loadmind-tracker/id6760754995';
    var playStore = 'https://play.google.com/store/apps/details?id=com.nexus.tracking.driver';

    var storeUrl = isIOS ? appStore : playStore;

    var intentUrl = 'intent://invite/' + inviteId +
      '#Intent;scheme=nexustracking;package=com.nexus.tracking.driver;' +
      'S.browser_fallback_url=' + encodeURIComponent(playStore) + ';end';

    var registerUrl = isIOS
      ? ('nexustracking://invite/' + inviteId)
      : intentUrl;

    var container = document.getElementById('content');
    container.innerHTML =
      '<a class="btn-main" href="' + registerUrl + '">' +
        '<span class="btn-icon">\u{1F517}</span>' +
        'Register' +
      '</a>' +
      '<div class="secondary">' +
        '<p class="secondary-label">Don\'t have the app?</p>' +
        '<a class="secondary-link" href="' + storeUrl + '">Get the App \u2192</a>' +
      '</div>';
  </script>
</body>
</html>
