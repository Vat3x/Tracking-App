<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoadMind Tracker — Invite</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f5f7fa; color: #333; padding: 20px; }
    .card { background: #fff; border-radius: 16px; padding: 36px 28px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h1 { font-size: 20px; color: #1F6AB5; margin-bottom: 28px; }

    .steps { text-align: left; margin-bottom: 28px; }
    .step { display: flex; align-items: center; gap: 14px; padding: 14px 0; }
    .step-icon { font-size: 36px; line-height: 1; flex-shrink: 0; width: 44px; text-align: center; }
    .step-text { font-size: 17px; font-weight: 600; color: #333; line-height: 1.4; }

    .divider { height: 1px; background: #e5e7eb; margin: 0 8px; }

    .btn-start { display: inline-block; background: transparent; color: #1a73e8; border: 1.5px solid #1a73e8; padding: 12px 40px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 15px; }
    .btn-start:active { background: #e8f0fe; }
  </style>
</head>
<body>
  <div class="card">
    <h1>LoadMind Tracker</h1>

    <div class="steps">
      <div class="step">
        <span class="step-icon">📱</span>
        <span class="step-text">Get the app</span>
      </div>
      <div class="divider"></div>
      <div class="step">
        <span class="step-icon">🔗</span>
        <span class="step-text">Tap this link to sign up</span>
      </div>
    </div>

    <div id="cta"></div>
  </div>
  <script>
    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/.test(ua);
    var path = window.location.pathname;
    var inviteId = path.split('/invite/')[1] || '';

    var appStore = 'https://apps.apple.com/us/app/loadmind-tracker/id6760754995';
    var playStore = 'https://play.google.com/store/apps/details?id=com.nexus.tracking.driver';

    var storeUrl = isIOS ? appStore : playStore;

    var intentUrl = 'intent://invite/' + inviteId +
      '#Intent;scheme=nexustracking;package=com.nexus.tracking.driver;' +
      'S.browser_fallback_url=' + encodeURIComponent(playStore) + ';end';

    // Android: intent URL opens app if installed, falls back to Play Store
    // iOS: go to App Store (Universal Links handle the app-installed case before this page loads)
    var startUrl = isIOS ? storeUrl : intentUrl;

    document.getElementById('cta').innerHTML =
      '<a class="btn-start" href="' + startUrl + '">Start</a>';
  </script>
</body>
</html>
